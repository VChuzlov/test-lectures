name: Собрать и опубликовать сайт лекций

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ставим зависимости каждой лекции
      - name: Установка зависимостей лекций
        run: |
          for d in lectures/*/; do
            if [ -f "$d/package.json" ]; then
              echo "npm ci в $d"
              (cd "$d" && npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
            fi
          done

      # ВАЖНО: --base должен совпадать с именем репозитория,
      # если сайт публикуется как https://<user>.github.io/<repo>/
      - name: Сборка сайта
        run: python tools/build_site.py --base "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
